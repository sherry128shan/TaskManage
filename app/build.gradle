plugins {
    id 'com.android.application'
}
/*原本compileSdk为 33
* applicationId "com.example.TaskMate"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
* */
android {
    namespace 'com.example.TaskMate'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.TaskMate"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    // AndroidX libraries and Material components
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'it.xabaras.android:recyclerview-swipedecorator:1.4'

    // Room dependencies for local database
    implementation 'androidx.room:room-runtime:2.5.0'
    implementation 'androidx.annotation:annotation-jvm:1.9.1'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.camera:camera-view:1.4.0'
    annotationProcessor 'androidx.room:room-compiler:2.5.0'

    // Testing libraries
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // For lifecycle-aware components like ViewModel and LiveData
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.5.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.0"

    //mirror
    implementation 'androidx.camera:camera-core:1.1.0-alpha04'
    implementation 'androidx.camera:camera-camera2:1.1.0-alpha04'
    implementation 'androidx.camera:camera-lifecycle:1.1.0-alpha04'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.annotation:annotation:1.9.1' // 强制使用指定版本
    }
}
